<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Teleprompter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;700;800&family=Noto+Naskh+Arabic:wght@400;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0d0f14; --fg:#f4f1e8; --said:#5f6675; --cur:#ffc23d; --curbg:rgba(255,194,61,.16);
  --panel:#151821; --line:rgba(255,255,255,.12); --ui:#d5d9e3; --mut:#8b92a3; --accent:#ffc23d; --rec:#ff4d4d;
  --font:'Cairo',sans-serif; --size:56px; --lh:1.7; --width:900px;
  --glass:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  --glass-h:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));
  --gshadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Inter','IBM Plex Sans Arabic','Cairo',system-ui,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit}
/* top bar */
#bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:rgba(18,21,29,.55);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:8px;margin-inline-end:6px;color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap;direction:ltr}
.brand svg{width:26px;height:26px;flex:none}
/* glass controls */
.btn,.tg button,.glass{background:var(--glass);color:var(--ui);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;
  backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);box-shadow:var(--gshadow);transition:background .2s,border-color .2s,transform .12s,color .2s}
.btn:hover,.tg button:hover,.glass:hover{background:var(--glass-h);border-color:rgba(255,255,255,.28);color:#fff}
.btn:active,.tg button:active{transform:translateY(1px)}
.btn:focus-visible,.tg button:focus-visible,.glass:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mic{background:linear-gradient(180deg,rgba(255,206,92,.95),rgba(255,176,32,.85));color:#1a1300;border-color:rgba(255,230,160,.7);font-weight:700;padding:8px 18px}
#mic.on{background:linear-gradient(180deg,rgba(255,110,110,.95),rgba(230,50,50,.85));border-color:rgba(255,190,190,.6);color:#fff}
#mic .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
#mic.on .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.tg{display:inline-flex;gap:0}
.tg button{border-radius:0;padding:8px 11px;min-width:38px;font-size:15px;justify-content:center}
.tg button:first-child{border-start-start-radius:12px;border-end-start-radius:12px}
.tg button:last-child{border-start-end-radius:12px;border-end-end-radius:12px}
.tg button+button{border-inline-start:0}
.tg button.act{background:linear-gradient(180deg,rgba(255,206,92,.9),rgba(255,176,32,.75));color:#1a1300;font-weight:700}
#status{font-size:13px;color:var(--mut);margin-inline-start:auto;max-width:40ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#heard{position:fixed;inset:auto 0 0 0;z-index:5;padding:8px 16px;font-size:15px;color:var(--mut);background:rgba(18,21,29,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvl{display:inline-block;width:70px;height:8px;border-radius:4px;background:#2a2f3b;overflow:hidden;vertical-align:middle;margin-inline-end:8px}#lvl i{display:block;height:100%;width:0;background:#3ddc84;transition:width .08s}
#heard b{color:var(--ui);font-weight:600}
/* language picker */
.flag{width:20px;height:15px;border-radius:3px;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
#langBtn{max-width:230px}
#langBtn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#langPop{position:fixed;z-index:30;width:min(340px,calc(100vw - 24px));max-height:min(460px,70vh);display:flex;flex-direction:column;
  background:rgba(22,25,34,.92);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
.sbox{display:flex;align-items:center;gap:8px;margin:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.sbox svg{width:16px;height:16px;flex:none;opacity:.7}
#langQ{flex:1;background:none;border:0;outline:none;color:#fff;min-width:0}
#langList{overflow:auto;padding:0 6px 8px;margin:0;list-style:none}
#langList li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ui);font-size:14px}
#langList li:hover,#langList li.hi{background:rgba(255,255,255,.09);color:#fff}
#langList li.sel{color:var(--accent);font-weight:700}
#langList li small{margin-inline-start:auto;color:var(--mut);font-size:12px;direction:ltr}
#langList .empty{color:var(--mut);cursor:default}
/* stage */
#stage{position:absolute;inset:0;overflow-y:auto;scroll-behavior:auto;scrollbar-width:thin;transform:scale(var(--fx,1),var(--fy,1))}
#script{max-width:var(--width);margin:0 auto;padding:50vh 24px 60vh;font-family:var(--font);font-size:var(--size);line-height:var(--lh);
  direction:var(--dir,rtl);text-align:var(--align,right);font-weight:600}
#script p{margin:0 0 .45em}
.w{border-radius:.18em;padding:0 .06em;cursor:pointer;transition:color .2s,background .2s}
.w.said{color:var(--said)}
.w.cur{color:var(--cur);background:var(--curbg);box-shadow:0 .08em 0 var(--cur)}
#guide{position:fixed;inset-inline:0;top:50%;height:0;border-top:2px dashed color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none;z-index:2}
#guide::before,#guide::after{content:"";position:absolute;top:-9px;border:8px solid transparent}
#guide::before{right:4px;border-right-color:var(--accent)}
#guide::after{left:4px;border-left-color:var(--accent)}
/* panels */
.sheet{position:fixed;z-index:10;top:64px;inset-inline-end:16px;width:min(450px,calc(100vw - 32px));max-height:calc(100vh - 84px);overflow:auto;
  background:rgba(22,25,34,.9);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--ui);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 12px;font-size:16px;color:#fff}
.sub{font-size:14px;margin:4px 0 8px;color:#fff}
.row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;margin-bottom:12px;font-size:14px}
.row output{min-width:3ch;text-align:end;font-variant-numeric:tabular-nums;color:var(--mut)}
.row input[type=color]{width:46px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
select{background:rgba(255,255,255,.07);color:var(--ui);border:1px solid var(--line);border-radius:10px;padding:7px}
select option{background:#1b1f29}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.th{border:2px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;font-size:12px;text-align:center;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.th.act{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#editor{position:fixed;inset:0;z-index:20;background:rgba(5,6,10,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
#editor .box{width:min(980px,100%);height:min(88vh,920px);display:flex;flex-direction:column;gap:12px;background:rgba(22,25,34,.92);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#editor h2{margin:0;color:#fff;font-size:18px}
#editor p.hint{margin:0;color:var(--mut);font-size:13px}
#drop{border:1.5px dashed rgba(255,255,255,.22);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px}
#drop.over{border-color:var(--accent);background:rgba(255,194,61,.07)}
#fileMsg{color:var(--ui)}
#src{flex:1;resize:none;background:rgba(0,0,0,.25);color:#eee;border:1px solid var(--line);border-radius:12px;padding:16px;font-family:'Cairo','Inter',sans-serif;font-size:20px;line-height:1.8;text-align:start}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.primary{background:linear-gradient(180deg,rgba(255,206,92,.95),rgba(255,176,32,.85))!important;color:#1a1300!important;border-color:rgba(255,230,160,.7)!important;font-weight:700}
kbd{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:12px}
@media (prefers-reduced-motion:reduce){.w{transition:none}}
@media (max-width:760px){.brand span{display:none}#status{display:none}}
</style>
</head>
<body>
<div id="bar">
  <div class="brand" title="Online Teleprompter">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="8" width="52" height="36" rx="7" fill="#ffc23d"/><rect x="14" y="17" width="36" height="4" rx="2" fill="#1a1300"/><rect x="14" y="25" width="28" height="4" rx="2" fill="#1a1300" opacity=".55"/><rect x="14" y="33" width="32" height="4" rx="2" fill="#1a1300" opacity=".3"/><rect x="29" y="44" width="6" height="8" fill="#ffc23d"/><rect x="20" y="52" width="24" height="5" rx="2.5" fill="#ffc23d"/></svg>
    <span>Online Teleprompter</span>
  </div>
  <button class="btn" id="mic" data-t-title="spaceKey"><span class="dot"></span><span id="micTxt"></span></button>
  <button class="btn" id="editBtn"><span>✎</span><span data-t="script"></span></button>
  <button class="btn" id="resetBtn" data-t-title="restartTip"><span>⟲</span><span data-t="restart"></span></button>
  <button class="btn" id="setBtn"><span>⚙</span><span data-t="settings"></span></button>
  <button class="btn" id="langBtn" data-t-title="speechLang" aria-haspopup="listbox"><img class="flag" id="langFlag" alt=""><span class="nm" id="langName"></span><span aria-hidden="true">▾</span></button>
  <span class="tg" role="group" id="alignGrp"><button id="aR" data-t-title="alignRight">⇥</button><button id="aC" data-t-title="alignCenter">≡</button><button id="aL" data-t-title="alignLeft">⇤</button><button id="aJ" data-t-title="justify">☰</button></span>
  <span class="tg" role="group" id="flipGrp"><button id="fH" data-t-title="flipH">⇆</button><button id="fV" data-t-title="flipV">⇅</button></span>
  <button class="btn" id="fsBtn"><span>⛶</span><span data-t="fullscreen"></span></button>
  <span id="status"></span>
</div>

<div id="langPop" hidden role="dialog">
  <div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="langQ" autocomplete="off" data-t-ph="searchLang"></div>
  <ul id="langList" role="listbox"></ul>
</div>

<div id="stage"><div id="script"></div></div>
<div id="guide"></div>
<div id="heard"><span id="lvl"><i id="lvlBar"></i></span> <span data-t="hearing"></span> <b id="heardTxt">—</b></div>

<div class="sheet" id="settings" hidden>
  <h2 data-t="settings"></h2>
  <div class="row"><label for="sUi" data-t="uiLang"></label>
    <select id="sUi"><option value="auto" data-t="auto"></option><option value="en">English</option><option value="ar">العربية</option></select><span></span></div>
  <div class="sub" data-t="themes"></div>
  <div class="themes" id="themes"></div>
  <div class="row"><label for="sFont" data-t="font"></label>
    <select id="sFont">
      <option value="'Cairo',sans-serif">Cairo</option>
      <option value="'Tajawal',sans-serif">Tajawal</option>
      <option value="'IBM Plex Sans Arabic',sans-serif">IBM Plex Arabic</option>
      <option value="'Noto Naskh Arabic',serif">Noto Naskh</option>
      <option value="'Amiri',serif">Amiri</option>
      <option value="'Inter',sans-serif">Inter</option>
      <option value="system-ui,sans-serif" data-t="systemFont"></option>
    </select><span></span></div>
  <div class="row"><label for="sSize" data-t="size"></label><input type="range" id="sSize" min="24" max="140" step="2"><output id="oSize"></output></div>
  <div class="row"><label for="sLh" data-t="lh"></label><input type="range" id="sLh" min="1.2" max="2.6" step="0.1"><output id="oLh"></output></div>
  <div class="row"><label for="sWidth" data-t="width"></label><input type="range" id="sWidth" min="400" max="1800" step="20"><output id="oWidth"></output></div>
  <div class="row"><label for="sFg" data-t="fg"></label><input type="color" id="sFg"><span></span></div>
  <div class="row"><label for="sBg" data-t="bg"></label><input type="color" id="sBg"><span></span></div>
  <div class="row"><label for="sCur" data-t="cur"></label><input type="color" id="sCur"><span></span></div>
  <div class="row"><label for="sSaid" data-t="said"></label><input type="color" id="sSaid"><span></span></div>
  <div class="row"><label for="sPos" data-t="pos"></label><input type="range" id="sPos" min="20" max="70" step="1"><output id="oPos"></output></div>
  <div class="row"><label for="sSens" data-t="sens"></label>
    <select id="sSens"><option value="strict" data-t="strict"></option><option value="normal" data-t="normal"></option><option value="loose" data-t="loose"></option></select><span></span></div>
  <div class="row"><label data-t="micUsed"></label><span id="micName" style="font-size:12px;color:var(--mut)">—</span><span></span></div>
  <div class="acts"><button class="btn" id="defBtn" data-t="defaults"></button><button class="btn primary" id="closeSet" data-t="done"></button></div>
  <p style="font-size:12px;color:var(--mut);margin:14px 0 0" data-t-html="shortcuts"></p>
</div>

<div id="editor" hidden>
  <div class="box">
    <h2 data-t="scriptTitle"></h2>
    <p class="hint" data-t="scriptHint"></p>
    <div id="drop">
      <button class="btn" id="fileBtn"><span>⬆</span><span data-t="upload"></span></button>
      <input type="file" id="fileIn" hidden accept=".txt,.md,.text,.srt,.vtt,.docx,.pptx,.pdf,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation">
      <span id="fileMsg" data-t="dropHint"></span>
    </div>
    <textarea id="src" spellcheck="false" dir="auto"></textarea>
    <div class="acts">
      <button class="btn primary" id="useBtn" data-t="use"></button>
      <button class="btn" id="fmtBtn"><span>✨</span><span data-t="format"></span></button>
      <button class="btn" id="cancelEdit" data-t="cancel"></button>
    </div>
  </div>
</div>

/* ---------- normalization & matching ---------- */
function norm(w){
  return w.replace(/[ً-ٰٟـ]/g,'')
    .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^\p{L}\p{N}]/gu,'').toLowerCase();
}
function strip(w){return w.replace(/^(وال|بال|فال|كال|لل|ال|و|ف|ب)(?=..)/,'')}
function lev(a,b){
  if(a===b)return 0; const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[n];
}
function sim(a,b){
  if(!a||!b)return 0; if(a===b)return 1;
  const a2=strip(a),b2=strip(b); if(a2===b2)return .95;
  const d=lev(a2,b2); return 1-d/Math.max(a2.length,b2.length);
}

/* ---------- state ---------- */
let words=[],pos=0,committed=0;
function render(text){
  const box=$('script'); box.innerHTML=''; words=[];
  text.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const p=document.createElement('p');
    line.split(/\s+/).forEach((tok,i)=>{
      if(i)p.appendChild(document.createTextNode(' '));
      const s=document.createElement('span'); s.className='w'; s.textContent=tok;
      const n=norm(tok);
      if(n){const idx=words.length; s.dataset.i=idx; words.push({el:s,n}); s.onclick=()=>jump(idx);}
      p.appendChild(s);
    });
    box.appendChild(p);
  });
  pos=committed=0; paint(true);
}
function jump(i){pos=committed=Math.max(0,Math.min(words.length,i));paint(true)}

let lastTop=null;
function paint(force){
  words.forEach((w,i)=>{w.el.classList.toggle('said',i<pos);w.el.classList.toggle('cur',i===pos)});
  const target=words[Math.min(pos,words.length-1)];
  if(!target)return;
  const top=target.el.offsetTop;
  if(force||top!==lastTop){lastTop=top;scrollTo(target.el)}
  if(pos>=words.length&&listening)stop();
  $('status').textContent=pos>=words.length?t('finished'):t('wordOf',pos+1,words.length);
}
let anim=null;
function scrollTo(el){
  const st=$('stage'); const frac=(S.pos||45)/100;
  const goal=el.offsetTop+el.offsetHeight/2-st.clientHeight*frac;
  cancelAnimationFrame(anim); const start=st.scrollTop,d=goal-start,t0=performance.now(),dur=matchMedia('(prefers-reduced-motion:reduce)').matches?0:450;
  const step=tm=>{const k=dur?Math.min(1,(tm-t0)/dur):1;st.scrollTop=start+d*(1-Math.pow(1-k,3));if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}

/* ---------- matching engine ---------- */
const STOP=new Set(['في','من','علي','على','ان','انا','انت','ده','دي','و','يا','لا','ما','هو','هي','اللي','كده','بس','مش','عن','الي','او','هنا','كان','يعني','اه','طيب','لو','مع','ايه','دا','كل','هم','احنا','بقي','بقى','تمام',
 'the','a','an','and','or','to','of','in','on','at','is','it','i','you','we','so','uh','um','this','that','for','with','be','are','was']);
const SENS={strict:0.82,normal:0.72,loose:0.62};
function need(x){const b=SENS[S.sens]||0.72; return x.length<=2?1:(x.length<=4?Math.min(.95,b+.1):b)}
function m(x,wi){return wi<words.length&&sim(x,words[wi].n)>=need(x)}
function align(from,toks){
  const tk=toks.map(norm).filter(Boolean); let p=from,i=0;
  while(i<tk.length&&p<words.length){
    if(m(tk[i],p)){
      const weak=STOP.has(words[p].n)||words[p].n.length<=2;
      if(!weak||(i+1<tk.length&&m(tk[i+1],p+1))){p++;i++;continue}
      if(i+1>=tk.length)break;
    }
    let ok=false;
    for(let k=1;k<=4&&!ok;k++){
      if(i+1<tk.length&&m(tk[i],p+k)&&m(tk[i+1],p+k+1)&&!(STOP.has(tk[i])&&STOP.has(tk[i+1]))){p=p+k+2;i+=2;ok=true}
    }
    if(!ok&&i+2<tk.length){
      for(let q=p+5;q<Math.min(words.length-2,p+120)&&!ok;q++){
        if(m(tk[i],q)&&m(tk[i+1],q+1)&&m(tk[i+2],q+2)){
          const strong=[tk[i],tk[i+1],tk[i+2]].filter(x=>!STOP.has(x)&&x.length>2).length;
          let seen=false;for(let r=Math.max(0,p-80);r<p&&!seen;r++)if(m(tk[i],r)&&m(tk[i+1],r+1)&&m(tk[i+2],r+2))seen=true;
          if(seen){i+=3;ok=true;break}
          if(strong>=2){p=q+3;i+=3;ok=true}
        }
      }
    }
    if(!ok)i++;
  }
  return p;
}
function advance(from,toks){return align(from,toks)}

/* ---------- speech ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let denied=0,rec=null,listening=false,lastHeard=0,lastVoice=0,dog=0,gen=0;
function openSession(){
  const my=++gen;
  const r=new SR(); r.lang=S.lang; r.continuous=true; r.interimResults=true; r.maxAlternatives=3;
  r.onresult=e=>{
    if(my!==gen)return;
    lastHeard=performance.now();denied=0;
    let p=committed,allFinal=true,shown='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const x=e.results[i]; let best=p;
      for(let a=0;a<x.length;a++){const q=align(p,x[a].transcript.trim().split(/\s+/));if(q>best)best=q}
      p=best; shown+=x[0].transcript+' ';
      if(x.isFinal&&allFinal)committed=p; else allFinal=false;
    }
    $('heardTxt').textContent=shown.trim()||'—';
    if(p>pos){pos=p;paint()}else if(committed>pos){pos=committed;paint()}
    if(listening&&allFinal&&e.results.length>=6)recycle();
  };
  r.onerror=e=>{
    if(my!==gen)return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){denied++;if(mStream&&denied<4)return;$('status').textContent=t('srDenied');stop()}
    else if(e.error==='network'){$('status').textContent=t('net')}
  };
  r.onend=()=>{if(my!==gen||!listening)return; committed=pos; openSession()};
  rec=r;
  try{r.start();lastHeard=performance.now()}catch(err){setTimeout(()=>listening&&my===gen&&openSession(),150)}
}
function recycle(){committed=pos;const old=rec;gen++;try{old.onend=null;old.abort()}catch(_){}if(listening)openSession()}
async function startRec(){
  if(words.length&&pos>=words.length){$('status').textContent=t('finishedStart');return}
  if(!SR){$('status').textContent=t('noSR');return}
  $('status').textContent=t('askMic');
  const ok=await startMeter();
  if(!ok){$('status').textContent=t('micDenied');return}
  listening=true;setMic();$('status').textContent=t('listening');openSession();
  clearInterval(dog);
  dog=setInterval(()=>{
    if(!listening)return;const now=performance.now();
    if(now-lastVoice<800&&now-lastHeard>2500){lastHeard=now;recycle()}
  },500);
}
function stop(){listening=false;clearInterval(dog);stopMeter();gen++;try{rec&&rec.abort()}catch(_){}committed=pos;setMic()}
function setMic(){$('mic').classList.toggle('on',listening);$('micTxt').textContent=listening?t('stop'):t('start')}
$('mic').onclick=()=>listening?stop():startRec();

/* mic level meter — the microphone is released whenever listening stops */
let mStream=null,mCtx=null,mRaf=0;
async function startMeter(){
  if(mStream){try{mCtx&&mCtx.resume()}catch(e){}return true}
  try{
    mStream=await navigator.mediaDevices.getUserMedia({audio:true});
    $('micName').textContent=mStream.getAudioTracks()[0].label||t('defMic');
    mCtx=new AudioContext();const an=mCtx.createAnalyser();an.fftSize=512;mCtx.createMediaStreamSource(mStream).connect(an);
    const d=new Uint8Array(an.fftSize);
    const tick=()=>{an.getByteTimeDomainData(d);let x=0;for(const v of d)x=Math.max(x,Math.abs(v-128));
      const pct=Math.min(100,x/1.1);if(pct>12)lastVoice=performance.now();$('lvlBar').style.width=pct+'%';$('lvlBar').style.background=pct>90?'#ff4d4d':pct<8?'#666':'#3ddc84';mRaf=requestAnimationFrame(tick)};tick();
    return true;
  }catch(e){return false}
}
function stopMeter(){cancelAnimationFrame(mRaf);try{mStream&&mStream.getTracks().forEach(x=>x.stop());mCtx&&mCtx.close()}catch(e){}mStream=mCtx=null;$('lvlBar').style.width='0'}

/* ---------- sentence arranger: only inserts line breaks, never changes a word ---------- */
const CONN_AR=['بس','لكن','علشان','عشان','لأن','لان','وبعدين','بعدين','يعني','ولو','طيب','خلينا','دلوقتي','وكمان','كمان','وده','ودي','فلما','ولما','بحيث','عشان كده','وبكده','وبالتالي','ثم','حيث','لذلك'];
const CONN_EN=['but','because','so','then','and then','which','however','therefore','also','now','after','before','when','while','if','although'];
function wordsOf(s){return s.split(/\s+/).filter(Boolean)}
function formatScript(src){
  const original=wordsOf(src);
  if(!original.length)return {text:src,changed:false};
  // work on the token list so words can never change — we only decide where lines end
  const toks=original.slice(); const breaks=new Set();
  const endSent=/[.!?؟…]["'”’»)\]]*$/, endSoft=/[،,;؛:]$/;
  toks.forEach((w,i)=>{if(endSent.test(w))breaks.add(i)});
  // respect existing line breaks
  let idx=0;src.split(/\n/).forEach(line=>{const n=wordsOf(line).length;if(n){idx+=n;breaks.add(idx-1)}});
  // long stretches: break at commas, then at connectors, then evenly
  const isConn=i=>{const w=norm(toks[i]);const w2=i+1<toks.length?w+' '+norm(toks[i+1]):w;
    return CONN_AR.some(c=>norm(c)===w||c.split(' ').map(norm).join(' ')===w2)||CONN_EN.some(c=>c===w||c===w2)};
  const MAX=18,HARD=22,MIN=4;
  const multiStart=w=>['and','و','so'].includes(norm(w));
  const pick=(s0,e0,test,ideal)=>{let best=-1,bd=1e9;for(let i=s0+MIN;i<=Math.min(e0-MIN+1,s0+HARD);i++){if(!test(i))continue;const d=Math.abs(i-(s0+ideal));if(d<bd){bd=d;best=i}}return best};
  let start=0;
  const ends=[...new Set([...breaks,toks.length-1])].sort((x,y)=>x-y);
  for(const end of ends){
    let s0=start;
    while(end-s0+1>MAX){
      let c=pick(s0,end,i=>endSoft.test(toks[i-1]),13);                                   // after a comma
      if(c<0)c=pick(s0,end,i=>isConn(i)&&!(i>0&&multiStart(toks[i-1])&&isConn(i-1)),11); // before a connector
      if(c<0)c=pick(s0,end,i=>multiStart(toks[i])&&!multiStart(toks[i-1]),11);              // before "and"/"و"
      if(c<0)c=Math.min(s0+12,end-MIN+1);
      if(c<=s0)break;
      breaks.add(c-1);s0=c;
    }
    start=end+1;
  }
  const lines=[];let cur=[];
  toks.forEach((w,i)=>{cur.push(w);if(breaks.has(i)){lines.push(cur.join(' '));cur=[]}});
  if(cur.length)lines.push(cur.join(' '));
  const out=lines.join('\n');
  // safety: the words must be exactly the same, in the same order
  const after=wordsOf(out);
  if(after.length!==original.length||after.some((w,i)=>w!==original[i]))return {text:src,changed:false};
  return {text:out,changed:out!==src};
}

/* ---------- file import ---------- */
const LIBS={
  mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  jszip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
};
const loaded={};
function lib(url){return loaded[url]||(loaded[url]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>{delete loaded[url];no(new Error('load'))};document.head.appendChild(s)}))}
function readText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(f)})}
function readBuf(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsArrayBuffer(f)})}
function xmlText(x){return x.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&')}
function fromSubs(s){
  const out=[];
  s.replace(/\r/g,'').split(/\n/).forEach(l=>{
    l=l.trim();
    if(!l||/^\d+$/.test(l)||/-->/.test(l)||/^WEBVTT/i.test(l)||/^(NOTE|STYLE|REGION)\b/.test(l))return;
    l=l.replace(/<[^>]+>/g,'').replace(/\{\\[^}]*\}/g,'').trim();
    if(l&&out[out.length-1]!==l)out.push(l);
  });
  return out.join(' ');
}
async function extract(f){
  const n=f.name.toLowerCase(),ext=n.split('.').pop();
  if(ext==='doc')throw new Error('doc');
  if(['txt','md','text'].includes(ext)||f.type==='text/plain')return await readText(f);
  if(ext==='srt'||ext==='vtt')return fromSubs(await readText(f));
  if(ext==='docx'){await lib(LIBS.mammoth);const r=await mammoth.extractRawText({arrayBuffer:await readBuf(f)});return r.value}
  if(ext==='pptx'){
    await lib(LIBS.jszip);const z=await JSZip.loadAsync(await readBuf(f));
    const slides=Object.keys(z.files).filter(p=>/^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
    const parts=[];
    for(const p of slides){const x=await z.file(p).async('string');
      const paras=(x.match(/<a:p>[\s\S]*?<\/a:p>/g)||[]).map(pp=>(pp.match(/<a:t>[\s\S]*?<\/a:t>/g)||[]).map(xmlText).join('')).map(s=>s.trim()).filter(Boolean);
      if(paras.length)parts.push(paras.join('\n'))}
    return parts.join('\n');
  }
  if(ext==='pdf'){
    await lib(LIBS.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker;
    const doc=await pdfjsLib.getDocument({data:await readBuf(f)}).promise;const out=[];
    for(let i=1;i<=doc.numPages;i++){const c=await (await doc.getPage(i)).getTextContent();let line='';
      for(const it of c.items){line+=it.str;if(it.hasEOL){out.push(line.trim());line=''}else if(it.str&&!/\s$/.test(it.str))line+=' '}
      if(line.trim())out.push(line.trim())}
    return out.filter(Boolean).join('\n').replace(/[ \t]+/g,' ');
  }
  return await readText(f);
}
async function importFile(f){
  if(!f)return;
  $('fileMsg').textContent=t('reading',f.name);
  try{
    const txt=(await extract(f)).replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    if(!txt)throw new Error('empty');
    $('src').value=txt;$('fileMsg').textContent=t('loaded',f.name,wordsOf(txt).length);
  }catch(e){$('fileMsg').textContent=e.message==='doc'?t('docOld'):t('fileErr',f.name)}
}
$('fileBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};
const drop=$('drop');
['dragenter','dragover'].forEach(ev=>$('editor').addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>$('editor').addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'||e.target===$('editor'))drop.classList.remove('over')}));
$('editor').addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)importFile(f)});

["de-DE", "Deutsch", "German"], ["it-IT", "Italiano", "Italian"], ["nl-NL", "Nederlands", "Dutch"], ["sv-SE", "Svenska", "Swedish"], ["da-DK", "Dansk", "Danish"], ["nb-NO", "Norsk bokmål", "Norwegian"], ["fi-FI", "Suomi", "Finnish"], ["is-IS", "Íslenska", "Icelandic"], ["pl-PL", "Polski", "Polish"], ["cs-CZ", "Čeština", "Czech"], ["sk-SK", "Slovenčina", "Slovak"], ["hu-HU", "Magyar", "Hungarian"], ["ro-RO", "Română", "Romanian"], ["bg-BG", "Български", "Bulgarian"], ["el-GR", "Ελληνικά", "Greek"], ["hr-HR", "Hrvatski", "Croatian"], ["sr-RS", "Српски", "Serbian"], ["sl-SI", "Slovenščina", "Slovenian"], ["uk-UA", "Українська", "Ukrainian"], ["ru-RU", "Русский", "Russian"], ["lt-LT", "Lietuvių", "Lithuanian"], ["lv-LV", "Latviešu", "Latvian"], ["et-EE", "Eesti", "Estonian"], ["ca-ES", "Català", "Catalan"], ["eu-ES", "Euskara", "Basque"], ["gl-ES", "Galego", "Galician"], ["tr-TR", "Türkçe", "Turkish"], ["az-AZ", "Azərbaycan", "Azerbaijani"], ["ka-GE", "ქართული", "Georgian"], ["hy-AM", "Հայերեն", "Armenian"], ["he-IL", "עברית", "Hebrew"], ["fa-IR", "فارسی", "Persian"], ["ur-PK", "اردو (پاکستان)", "Urdu (Pakistan)"], ["ur-IN", "اردو (بھارت)", "Urdu (India)"], ["hi-IN", "हिन्दी", "Hindi"], ["bn-BD", "বাংলা (বাংলাদেশ)", "Bengali (Bangladesh)"], ["bn-IN", "বাংলা (ভারত)", "Bengali (India)"], ["ta-IN", "தமிழ்", "Tamil"], ["te-IN", "తెలుగు", "Telugu"], ["mr-IN", "मराठी", "Marathi"], ["gu-IN", "ગુજરાતી", "Gujarati"], ["kn-IN", "ಕನ್ನಡ", "Kannada"], ["ml-IN", "മലയാളം", "Malayalam"], ["pa-Guru-IN", "ਪੰਜਾਬੀ", "Punjabi"], ["ne-NP", "नेपाली", "Nepali"], ["si-LK", "සිංහල", "Sinhala"], ["zh-CN", "中文 (普通话, 中国)", "Chinese (Mandarin, China)"], ["zh-TW", "中文 (台灣)", "Chinese (Taiwan)"], ["yue-Hant-HK", "粵語 (香港)", "Cantonese (Hong Kong)"], ["ja-JP", "日本語", "Japanese"], ["ko-KR", "한국어", "Korean"], ["th-TH", "ไทย", "Thai"], ["vi-VN", "Tiếng Việt", "Vietnamese"], ["id-ID", "Bahasa Indonesia", "Indonesian"], ["ms-MY", "Bahasa Melayu", "Malay"], ["fil-PH", "Filipino", "Filipino"], ["jv-ID", "Basa Jawa", "Javanese"], ["su-ID", "Basa Sunda", "Sundanese"], ["km-KH", "ខ្មែរ", "Khmer"], ["lo-LA", "ລາວ", "Lao"], ["my-MM", "မြန်မာ", "Burmese"], ["mn-MN", "Монгол", "Mongolian"], ["kk-KZ", "Қазақ", "Kazakh"], ["uz-UZ", "Oʻzbek", "Uzbek"], ["sw-KE", "Kiswahili (Kenya)", "Swahili (Kenya)"], ["sw-TZ", "Kiswahili (Tanzania)", "Swahili (Tanzania)"], ["am-ET", "አማርኛ", "Amharic"], ["zu-ZA", "isiZulu", "Zulu"], ["af-ZA", "Afrikaans", "Afrikaans"], ["so-SO", "Soomaali", "Somali"], ["ha-NG", "Hausa", "Hausa"], ["yo-NG", "Yorùbá", "Yoruba"]];
const RTL=/^(ar|he|iw|fa|ur)(-|$)/;
const flagUrl=c=>{const r=c.split('-').pop().toLowerCase();return `https://flagcdn.com/w40/${r}.png`};
function langInfo(c){return LANGS.find(l=>l[0]===c)||LANGS[0]}
function showLang(){const l=langInfo(S.lang);$('langFlag').src=flagUrl(l[0]);$('langFlag').alt=l[2];$('langName').textContent=l[1]}
let hiIdx=0,shown=[];
function fillLangs(q){
  q=(q||'').trim().toLowerCase();const qn=norm(q);
  const score=l=>{if(!q)return 1;const hay=[l[1],l[2],l[0]].map(s=>s.toLowerCase());
    if(hay.some(h=>h.startsWith(q)))return 3;if(hay.some(h=>h.split(/[\s(,/]+/).some(w=>w.startsWith(q)||(qn&&norm(w).startsWith(qn)))))return 2;if(hay.some(h=>h.includes(q)))return 1;return 0};
  shown=LANGS.map(l=>[l,score(l)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const ul=$('langList');ul.innerHTML='';hiIdx=0;
  if(!shown.length){const li=document.createElement('li');li.className='empty';li.textContent=t('noLang');ul.appendChild(li);return}
  shown.forEach((l,i)=>{const li=document.createElement('li');li.setAttribute('role','option');if(l[0]===S.lang)li.classList.add('sel');if(i===0)li.classList.add('hi');
    const img=document.createElement('img');img.className='flag';img.loading='lazy';img.alt='';img.src=flagUrl(l[0]);
    const nm=document.createElement('span');nm.textContent=l[1];const sm=document.createElement('small');sm.textContent=l[2]===l[1]?l[0]:l[2];
    li.append(img,nm,sm);li.onclick=()=>pickLang(l[0]);ul.appendChild(li)});
}
function pickLang(c){S.lang=c;S.align=RTL.test(c)?'right':'left';closeLang();applySettings();paint(true);if(listening){stop();startRec()}}
function openLang(){const b=$('langBtn').getBoundingClientRect(),p=$('langPop');p.hidden=false;
  const w=p.offsetWidth;let x=document.documentElement.dir==='rtl'?b.right-w:b.left;x=Math.max(12,Math.min(x,innerWidth-w-12));p.style.left=x+'px';p.style.top=(b.bottom+8)+'px';
  $('langQ').value='';fillLangs('');$('langQ').focus();const s=$('langList').querySelector('.sel');s&&s.scrollIntoView({block:'center'})}
function closeLang(){$('langPop').hidden=true}
$('langBtn').onclick=e=>{e.stopPropagation();$('langPop').hidden?openLang():closeLang()};
$('langQ').oninput=e=>fillLangs(e.target.value);
$('langQ').onkeydown=e=>{const items=[...$('langList').querySelectorAll('li[role=option]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;items[hiIdx]&&items[hiIdx].classList.remove('hi');hiIdx=(hiIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[hiIdx].classList.add('hi');items[hiIdx].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&shown[hiIdx]){e.preventDefault();pickLang(shown[hiIdx][0])}
  else if(e.key==='Escape')closeLang()};
document.addEventListener('click',e=>{if(!$('langPop').hidden&&!$('langPop').contains(e.target))closeLang()});

/* ---------- settings ---------- */
const DEF={font:"'Cairo',sans-serif",size:56,lh:1.7,width:900,fg:'#f4f1e8',bg:'#0d0f14',cur:'#ffc23d',said:'#5f6675',pos:45,lang:'en-US',sens:'normal',align:'left',fx:false,fy:false,theme:'night',ui:'auto'};
const THEMES={night:['#0d0f14','#f4f1e8','#ffc23d','#5f6675'],black:['#000000','#ffffff','#ffe14d','#4d4d4d'],studio:['#050505','#f2f2f2','#2fd3ff','#555a60'],navy:['#0b1730','#e8eefc','#7cc4ff','#4a5a7a'],forest:['#0f1f17','#e6f2ea','#7ee2a8','#4f6b5b'],plum:['#1b1028','#f1e9fb','#ff9ad5','#6c5a80'],sepia:['#2a1f16','#f6e7d2','#ffb35c','#7a6551'],paper:['#f7f2e7','#1f1b14','#c2410c','#b3aa98'],white:['#ffffff','#111418','#1565ff','#a7adb7'],sky:['#e9f4ff','#0d2236','#e85d04','#9db3c8'],mint:['#ecf8f1','#123222','#0f8a5f','#9ab8a7'],kids:['#fff6d6','#2b2440','#ff4f8b','#b9ae8c']};
const saved=store.get('settings',null);
let S=Object.assign({},DEF,saved||{});
if(!saved){const ar=/(^|,)ar/.test((navigator.languages||[navigator.language||'']).join(',').toLowerCase());if(ar){S.lang='ar-EG';S.align='right'}}
if(!LANGS.some(l=>l[0]===S.lang))S.lang=DEF.lang;
function applySettings(){
  const r=document.documentElement.style;
  r.setProperty('--font',S.font);r.setProperty('--size',S.size+'px');r.setProperty('--lh',S.lh);r.setProperty('--width',S.width+'px');
  r.setProperty('--fg',S.fg);r.setProperty('--bg',S.bg);r.setProperty('--cur',S.cur);r.setProperty('--said',S.said);r.setProperty('--curbg',S.cur+'29');
  r.setProperty('--dir',RTL.test(S.lang)?'rtl':'ltr');r.setProperty('--align',S.align);r.setProperty('--fx',S.fx?-1:1);r.setProperty('--fy',S.fy?-1:1);
  $('guide').style.top=(S.fy?100-S.pos:S.pos)+'%';
  showLang();
  [['aR','right'],['aC','center'],['aL','left'],['aJ','justify']].forEach(([id,v])=>$(id).classList.toggle('act',S.align===v));
  $('fH').classList.toggle('act',S.fx);$('fV').classList.toggle('act',S.fy);
  document.querySelectorAll('.th').forEach(b=>b.classList.toggle('act',b.dataset.k===S.theme));
  $('sFont').value=S.font;$('sSize').value=S.size;$('sLh').value=S.lh;$('sWidth').value=S.width;$('sFg').value=S.fg;$('sBg').value=S.bg;
  $('sCur').value=S.cur;$('sSaid').value=S.said;$('sPos').value=S.pos;$('sSens').value=S.sens;$('sUi').value=S.ui;
  $('oSize').textContent=S.size;$('oLh').textContent=S.lh;$('oWidth').textContent=S.width;$('oPos').textContent=S.pos+'%';
  store.set('settings',S);
}
const map={sFont:'font',sSize:'size',sLh:'lh',sWidth:'width',sFg:'fg',sBg:'bg',sCur:'cur',sSaid:'said',sPos:'pos',sSens:'sens'};
for(const id in map)$(id).addEventListener('input',e=>{const v=e.target.value,k=map[id];S[k]=['size','width','pos','lh'].includes(k)?+v:v;if(['fg','bg','cur','said'].includes(k))S.theme='custom';applySettings();paint(true)});
$('sUi').onchange=e=>{S.ui=e.target.value;applySettings();applyUi()};
[['aR','right'],['aC','center'],['aL','left'],['aJ','justify']].forEach(([id,v])=>$(id).onclick=()=>{S.align=v;applySettings();paint(true)});
$('fH').onclick=()=>{S.fx=!S.fx;applySettings()};
$('fV').onclick=()=>{S.fy=!S.fy;applySettings();paint(true)};
for(const k in THEMES){const [bg,fg,cur]=THEMES[k];const b=document.createElement('button');b.className='th';b.dataset.k=k;b.style.background=bg;b.style.color=fg;b.style.borderBottom='4px solid '+cur;
  b.onclick=()=>{const x=THEMES[k];S.theme=k;S.bg=x[0];S.fg=x[1];S.cur=x[2];S.said=x[3];applySettings();paint(true)};$('themes').appendChild(b)}
$('setBtn').onclick=()=>{closeLang();$('settings').hidden=!$('settings').hidden};
$('closeSet').onclick=()=>$('settings').hidden=true;
$('defBtn').onclick=()=>{const keep={lang:S.lang,align:S.align,ui:S.ui};S=Object.assign({},DEF,keep);applySettings();applyUi();paint(true)};
$('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

/* ---------- keys ---------- */
document.addEventListener('keydown',e=>{
  if(!$('editor').hidden||!$('langPop').hidden||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();listening?stop():startRec()}
  else if(e.key==='ArrowDown'){e.preventDefault();jump(pos+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();jump(pos-1)}
  else if(e.key==='PageDown'){e.preventDefault();const p=words[pos]&&words[pos].el.parentElement.nextElementSibling;if(p&&p.querySelector('.w'))jump(+p.querySelector('.w').dataset.i)}
  else if(e.key==='Escape'){$('settings').hidden=true}
});

applySettings();
applyUi();
render(store.get('script',UI==='ar'?SAMPLE_AR:SAMPLE_EN));
if(!SR)$('status').textContent=t('noSR');
</script>
